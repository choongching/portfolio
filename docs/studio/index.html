<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Motion studio · designby.cc</title>
<link rel="icon" href="/favicon.ico">
<style>
  :root {
    --bg: #ffffff; --canvas: #ececec; --dot: #d6d6d6; --line: #e3e3e3; --line-strong: #cfcfcf;
    --text: #1d1d1f; --muted: #7a7a7a; --faint: #a6a6a6; --hover: #f3f3f3;
    --accent: #3e63dd; --accent-soft: #e8edfc; --warn: #b4441b;
    --top: 44px; --left: 220px; --right: 288px; --tl: 196px;
    font: 12px/1.4 -apple-system, BlinkMacSystemFont, "Inter", "Segoe UI", sans-serif;
    color-scheme: light;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; overflow: hidden; background: var(--bg); color: var(--text); }
  button, input, select { font: inherit; color: inherit; }
  button { cursor: pointer; background: none; border: 0; }
  .app { display: grid; height: 100%; grid-template: var(--top) 1fr var(--tl) / var(--left) 1fr var(--right);
    grid-template-areas: "top top top" "left canvas right" "left tl right"; }

  /* top bar */
  .top { grid-area: top; display: flex; align-items: center; gap: 6px; padding: 0 10px; border-bottom: 1px solid var(--line); }
  .top .name { font-weight: 600; margin-right: 10px; white-space: nowrap; }
  .top .name span { color: var(--muted); font-weight: 400; }
  .sep { width: 1px; height: 20px; background: var(--line); margin: 0 6px; }
  .btn { height: 28px; padding: 0 10px; border-radius: 6px; white-space: nowrap; }
  .btn:hover { background: var(--hover); }
  .btn[aria-pressed="true"] { background: var(--accent-soft); color: var(--accent); }
  .btn.primary { background: var(--accent); color: #fff; }
  .btn.primary:disabled { background: #e6e6e6; color: var(--faint); cursor: default; }
  .btn kbd { font: 10px/1 ui-monospace, monospace; color: var(--faint); margin-left: 4px; }
  .seg { display: flex; background: var(--hover); border-radius: 7px; padding: 2px; }
  .seg button { height: 24px; padding: 0 8px; border-radius: 5px; color: var(--muted); }
  .seg button[aria-pressed="true"] { background: #fff; color: var(--text); box-shadow: 0 0 0 1px var(--line); }
  .grow { flex: 1; }
  .zoom { min-width: 48px; text-align: center; color: var(--muted); }
  .status { color: var(--muted); white-space: nowrap; }
  .status.dirty { color: var(--warn); }

  /* panels */
  .panel { background: var(--bg); overflow: auto; }
  .left { grid-area: left; border-right: 1px solid var(--line); }
  .right { grid-area: right; border-left: 1px solid var(--line); }
  .ph { padding: 12px 12px 6px; font-weight: 600; font-size: 11px; color: var(--muted); }
  .item { display: flex; align-items: center; gap: 8px; width: 100%; height: 28px; padding: 0 12px; text-align: left; border-radius: 0; }
  .item:hover { background: var(--hover); }
  .item[aria-selected="true"] { background: var(--accent-soft); color: var(--accent); }
  .item .dot { width: 7px; height: 7px; border-radius: 2px; background: var(--line-strong); flex: none; }
  .item[aria-selected="true"] .dot { background: var(--accent); }
  .item.two { height: auto; padding-top: 7px; padding-bottom: 7px; align-items: flex-start; }
  .item.two .dot { margin-top: 5px; }
  .item .nm { display: flex; flex-direction: column; }
  .item small { color: var(--faint); font-size: 11px; }
  .item[aria-selected="true"] small { color: var(--accent); opacity: .75; }
  .seg.mode button { padding: 0 12px; font-weight: 500; }
  .style-mode .mo { display: none; }
  .canvas[hidden] { display: none; }
  .page-mode #canvas, .page-mode .left .group, .page-mode #play, .page-mode #interact, .page-mode #zoom-in, .page-mode #zoom-out { display: none; }
  .page-mode #page-canvas { display: block; }
  .folder-mode #canvas, .folder-mode .left .group, .folder-mode #interact, .folder-mode #outlines, .folder-mode #status, .folder-mode #revert, .folder-mode #save { display: none; }
  .folder-mode #folder-canvas { display: block; }
  .folder-mode .insp .row { grid-template-columns: 112px 1fr 58px; }
  .folder-mode .insp .row.wide { grid-template-columns: 112px 1fr; }
  .item.tree.d1 { padding-left: 30px; }
  .item.tree .nm { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .insp .sel { margin: 0 14px 10px; padding: 6px 8px; background: #f6f6f6; border-radius: 6px; font: 11px/1.4 ui-monospace, monospace; color: var(--muted); word-break: break-all; }
  .row.ro span { grid-column: 2 / 4; color: var(--text); }
  .note.pad { padding: 8px 12px; }
  .app.style-mode { grid-template-rows: var(--top) 1fr 0; }
  .style-mode .tl { display: none; }
  .tiles { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; margin: 2px 0 10px; }
  .tile { display: flex; flex-direction: column; align-items: center; gap: 8px; padding: 12px 0 8px; border: 1px solid var(--line); border-radius: 8px; color: var(--muted); font-size: 11px; background: #fafafa; }
  .tile:hover { border-color: var(--line-strong); color: var(--text); }
  .tile[aria-pressed="true"] { border-color: var(--accent); color: var(--accent); background: #fff; }
  .tile .sq { width: 30px; height: 22px; border-radius: 5px; background: #fff; border: 1px solid var(--line); }
  .item .meta { margin-left: auto; color: var(--faint); font-size: 11px; }
  .item input { accent-color: var(--accent); }
  .group { padding-bottom: 8px; border-bottom: 1px solid var(--line); }

  /* inspector */
  .insp h2 { font-size: 13px; font-weight: 600; padding: 14px 14px 2px; }
  .insp .about { padding: 0 14px 10px; color: var(--muted); }
  .sec { border-top: 1px solid var(--line); padding: 10px 14px 12px; }
  .sec h3 { font-size: 11px; font-weight: 600; color: var(--muted); margin-bottom: 8px; display: flex; align-items: center; }
  .sec h3 .reset { margin-left: auto; font-weight: 400; color: var(--accent); font-size: 11px; }
  .row { display: grid; grid-template-columns: 84px 1fr 58px; align-items: center; gap: 8px; min-height: 28px; }
  .row label { color: var(--muted); }
  .row.changed label { color: var(--text); font-weight: 500; }
  .row input[type=range] { width: 100%; accent-color: var(--accent); }
  .num { width: 100%; height: 24px; border: 1px solid var(--line); border-radius: 5px; padding: 0 6px; text-align: right; background: #fff; }
  .num:focus, select:focus, .hex:focus { outline: 2px solid var(--accent-soft); border-color: var(--accent); }
  .row.wide { grid-template-columns: 84px 1fr; }
  select { height: 26px; border: 1px solid var(--line); border-radius: 5px; padding: 0 4px; background: #fff; width: 100%; }
  .color { display: flex; align-items: center; gap: 6px; }
  .color input[type=color] { width: 26px; height: 24px; border: 1px solid var(--line); border-radius: 5px; padding: 1px; background: #fff; }
  .hex { width: 84px; height: 24px; border: 1px solid var(--line); border-radius: 5px; padding: 0 6px; font-family: ui-monospace, monospace; font-size: 11px; }
  .curve { display: block; margin: 4px 0 6px; background: #fafafa; border: 1px solid var(--line); border-radius: 6px; touch-action: none; }
  .curve .grid { stroke: #ececec; }
  .curve .path { fill: none; stroke: var(--accent); stroke-width: 2; }
  .curve .arm { stroke: var(--faint); stroke-width: 1; }
  .curve .h { fill: #fff; stroke: var(--accent); stroke-width: 1.5; cursor: grab; }
  .chips { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 4px; }
  .chip { height: 24px; padding: 0 8px; border: 1px solid var(--line); border-radius: 12px; color: var(--muted); }
  .chip:hover { color: var(--text); border-color: var(--line-strong); }
  .note { color: var(--muted); padding: 2px 0 4px; }
  .note a { color: var(--accent); }

  /* canvas */
  .canvas { grid-area: canvas; position: relative; overflow: hidden; background-color: var(--canvas);
    background-image: radial-gradient(var(--dot) 1px, transparent 1.2px); cursor: default; touch-action: none; }
  .canvas.panning, .canvas.space { cursor: grab; }
  .canvas.panning:active { cursor: grabbing; }
  .world { position: absolute; left: 0; top: 0; transform-origin: 0 0; }
  .frame { position: absolute; }
  .frame[hidden] { display: none; }
  .frame .label { position: absolute; left: 0; bottom: 100%; padding-bottom: 6px; white-space: nowrap; color: var(--muted);
    transform-origin: 0 100%; font-size: 12px; }
  .frame .label b { color: var(--text); font-weight: 500; }
  .frame .box { position: relative; background: #fff; outline: 1px solid var(--line-strong); overflow: hidden; }
  .frame.active .box { outline: 2px solid var(--accent); }
  .frame iframe { display: block; border: 0; pointer-events: none; }
  .interact .frame iframe { pointer-events: auto; }
  .hl { position: absolute; pointer-events: none; outline: 1.5px solid var(--accent); }
  .hl.hover { outline: 1px dashed var(--accent); }
  .hl .tag { position: absolute; left: -1px; bottom: 100%; background: var(--accent); color: #fff; font-size: 11px; padding: 1px 5px;
    white-space: nowrap; transform-origin: 0 100%; }
    background: #fff; border: 1px solid var(--line-strong); border-radius: 10px; white-space: nowrap; flex-wrap: wrap; row-gap: 4px; }
  .btn.play { font-weight: 500; }
  .btn.play[aria-pressed="true"] { background: var(--accent-soft); color: var(--accent); }
  .hint.on { color: var(--accent); }
  .playhead[hidden] { display: none; }
  .hint { position: absolute; left: 12px; bottom: 10px; color: var(--muted); background: rgba(255,255,255,.85); padding: 4px 8px; border-radius: 6px; }

  /* timeline */
  .tl { grid-area: tl; border-top: 1px solid var(--line); display: grid; grid-template-columns: 150px 1fr; overflow: hidden; user-select: none; }
  .tl .names { border-right: 1px solid var(--line); }
  .tl .names div, .tl .lane { height: 24px; display: flex; align-items: center; }
  .tl .names div { padding: 0 12px; color: var(--muted); cursor: pointer; white-space: nowrap; }
  .tl .names div.sel { color: var(--accent); font-weight: 500; }
  .tl .names .head, .tl .ruler { height: 30px; border-bottom: 1px solid var(--line); }
  .tl .names .head { font-weight: 600; font-size: 11px; color: var(--muted); justify-content: space-between; }
  .tl .tracks { position: relative; overflow: hidden; }
  .ruler { position: relative; }
  .ruler span { position: absolute; top: 9px; font-size: 10px; color: var(--faint); transform: translateX(-50%); }
  .ruler i { position: absolute; bottom: 0; width: 1px; height: 6px; background: var(--line-strong); }
  .lane { position: relative; }
  .bar { position: absolute; top: 4px; height: 16px; border-radius: 4px; background: #e4e4e4; color: var(--muted); font-size: 10px;
    padding: 0 6px; line-height: 16px; white-space: nowrap; overflow: hidden; }
  .bar.edit { background: var(--accent-soft); color: var(--accent); cursor: ew-resize; }
  .bar.edit.sel { background: var(--accent); color: #fff; }
  .bar.off { background: repeating-linear-gradient(45deg, #f1f1f1 0 4px, #e9e9e9 4px 8px); }
  .bar .end { position: absolute; right: 0; top: 0; width: 7px; height: 100%; cursor: col-resize; }
  .bar .tick { position: absolute; top: 3px; width: 1px; height: 10px; background: currentColor; opacity: .5; }
  .playhead { position: absolute; top: 0; bottom: 0; width: 1px; background: var(--warn); pointer-events: none; }
  .playhead::before { content: ""; position: absolute; top: 0; left: -4px; border: 4px solid transparent; border-top-color: var(--warn); }
  .tl .foot { position: absolute; right: 10px; bottom: 6px; color: var(--faint); font-size: 11px; }
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <div class="name">Studio <span>designby.cc</span></div>
    <div class="seg mode" id="mode" title="Style: how the cards look. Motion: the intro animation. Page: every object on the phone page. Folder: the case studies folder prototype.">
      <button data-v="style">Style</button><button data-v="motion">Motion</button><button data-v="page">Page</button><button data-v="folder">Folder</button>
    </div>
    <div class="sep"></div>
    <button class="btn play" id="play" title="Play the intro in every frame, or stop it (the frames rest on the finished page)">▶ Play <kbd>Space</kbd></button>
    <div class="seg mo" id="speed" title="Playback speed (preview only, not saved)">
      <button data-v="0.25">0.25×</button><button data-v="0.5">0.5×</button><button data-v="1">1×</button>
    </div>
    <div class="sep mo"></div>
    <button class="btn mo" id="t-preloader" aria-pressed="true" title="Play the preloader before the opening">Preloader</button>
    <button class="btn mo" id="t-opening" aria-pressed="true" title="Play the opening (the logo animation) before the cards">Opening</button>
    <div class="grow"></div>
    <button class="btn" id="outlines" aria-pressed="false" title="Hide or show the blue selection outlines">Hide outlines <kbd>H</kbd></button>
    <button class="btn" id="interact" aria-pressed="false" title="Use the frames like a browser: click cards, drag the slider">Interact <kbd>I</kbd></button>
    <div class="sep"></div>
    <button class="btn" id="zoom-out" title="Zoom out">−</button>
    <button class="btn zoom" id="zoom" title="Fit both frames (Shift+1)">100%</button>
    <button class="btn" id="zoom-in" title="Zoom in">+</button>
    <div class="sep"></div>
    <span class="status" id="status">Saved</span>
    <button class="btn" id="revert" title="Drop the unsaved changes">Revert</button>
    <button class="btn primary" id="save" disabled title="Write the changes to site-design.js (⌘S)">Save</button>
  </header>

  <aside class="panel left">
    <div class="group">
      <div class="ph">Frames</div>
      <label class="item"><input type="checkbox" id="f-desktop" checked> Desktop <span class="meta">1505 × 880</span></label>
      <label class="item"><input type="checkbox" id="f-phone" checked> Phone <span class="meta">390 × 844</span></label>
    </div>
    <div class="ph" id="layers-head">Style</div>
    <div id="layers"></div>
  </aside>

  <main class="canvas" id="canvas">
    <div class="world" id="world"></div>
    <div class="hint" id="hint">Drag or scroll to move · ⌘ + scroll or pinch to zoom · click a card for its corners and colours · double-click the intro card for its text</div>
  </main>

  <main class="canvas" id="page-canvas" hidden></main>

  <main class="canvas" id="folder-canvas" hidden></main>

  <aside class="panel right insp" id="insp"></aside>

  <section class="tl" id="tl">
    <div class="names" id="tl-names"></div>
    <div class="tracks" id="tl-tracks"></div>
  </section>
</div>
<script type="module" src="%STUDIO%/studio.js"></script>
</body>
</html>
